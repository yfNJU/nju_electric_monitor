name: Auto Monitor Schedule

on:
  schedule:
    # 明确重建四个主调度，UTC 对应北京时间 03/09/15/21 点。
    - cron: '0 19 * * *'
    - cron: '0 1 * * *'
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
    # 避开整点的补采检查：当期已成功采集则跳过。仍受 GitHub 调度可用性影响。
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'site/**'
      - 'config_workflow.json'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: electricity-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-due:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}
    - name: Check whether this collection slot needs data
      id: check
      env:
        TRIGGER_EVENT: ${{ github.event_name }}
        TRIGGER_SCHEDULE: ${{ github.event.schedule }}
      run: python3 -B src/monitoring_checks.py

  run-monitor:
    needs: check-due
    if: needs.check-due.outputs.due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      data_commit: ${{ steps.publish.outputs.commit }}
    env:
      NJU_USERNAME: ${{ secrets.NJU_USERNAME }}
      NJU_PASSWORD: ${{ secrets.NJU_PASSWORD }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
      EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
      EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
        key: ${{ runner.os }}-ubuntu24-python311-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-ubuntu24-python311-pip-

    - name: Show disk usage before install
      run: df -h

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify preinstalled Chrome and matching ChromeDriver
      timeout-minutes: 2
      shell: bash
      run: |
        set -euo pipefail
        chrome=$(command -v google-chrome || command -v google-chrome-stable)
        driver=$(command -v chromedriver || true)
        if [ -z "$driver" ] && [ -n "${CHROMEWEBDRIVER:-}" ]; then
          driver="$CHROMEWEBDRIVER/chromedriver"
        fi
        test -x "$chrome"
        test -x "$driver"
        chrome_version=$("$chrome" --version)
        driver_version=$("$driver" --version)
        echo "$chrome_version"
        echo "$driver_version"
        test "$(echo "$chrome_version" | grep -oE '[0-9]+' | head -1)" = "$(echo "$driver_version" | grep -oE '[0-9]+' | head -1)"
        echo "CHROME_BINARY=$chrome" >> "$GITHUB_ENV"
        echo "CHROMEDRIVER_BINARY=$driver" >> "$GITHUB_ENV"

    - name: Install optional Chinese fonts (bounded)
      timeout-minutes: 4
      shell: bash
      run: |
        if fc-list :lang=zh | grep -q .; then
          echo "Chinese fonts are already installed"
        elif sudo timeout 60s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update &&
             sudo timeout 120s apt-get -o DPkg::Lock::Timeout=30 -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends fonts-noto-cjk; then
          timeout 30s fc-cache -f || true
        else
          echo "::warning::Chinese font installation unavailable; collection can continue with fallback fonts"
        fi

    - name: Install Python dependencies
      timeout-minutes: 8
      run: python -m pip install --timeout 30 --retries 2 -r requirements.txt

    - name: Run offline regression checks
      run: |
        python -B -m unittest discover -s src -p test_monitoring_checks.py -v
        node --test site/dashboard.test.cjs

    - name: Show disk usage
      run: df -h

    - name: Run Auto Monitor (Linux)
      shell: bash
      run: |
        echo "Running Python wrapper"
        python3 src/run_workflow_wrapper.py

    - name: Commit and push verified data
      id: publish
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        branch=${GITHUB_REF##*/}
        if git diff --quiet -- data/electricity_data.json; then
          echo "::error::Collection did not produce new electricity data"
          exit 1
        fi
        git add data/ logs/
        git commit -m "Auto update: verified electricity data (run ${GITHUB_RUN_ID})"
        # checkout 使用本次运行的 GITHUB_TOKEN，不再依赖长期 PAT。
        # 非快进推送必须失败，不能覆盖并发人工修改，也不能发布未推送的数据。
        git push origin "HEAD:$branch"
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "Verified electricity data committed and pushed successfully." >> "$GITHUB_STEP_SUMMARY"

    - name: Show latest wrapper log
      if: always()
      shell: bash
      run: |
        echo "Logs dir content:";
        ls -lt logs || true
        latest=$(ls -t logs 2>/dev/null | head -n1 || true)
        if [ -n "$latest" ]; then
          echo "---- BEGIN latest log: $latest ----";
          cat "logs/$latest" || true
          echo "---- END latest log ----";
        else
          echo "No log files found in ./logs"
        fi

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nju_electric_monitor-logs-${{ github.run_id }}
        path: |
          logs/**

  deploy-pages:
    needs: run-monitor
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.run-monitor.outputs.data_commit }}

name: Auto Monitor Schedule

on:
  schedule:
    - cron: "0 1,7,13,19 * * *" # 北京时间每天 03:00、09:00、15:00、21:00；GitHub 调度可能延迟
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'site/**'
      - 'config_workflow.json'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: electricity-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      data_commit: ${{ steps.publish.outputs.commit }}
    env:
      NJU_USERNAME: ${{ secrets.NJU_USERNAME }}
      NJU_PASSWORD: ${{ secrets.NJU_PASSWORD }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
      EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
      EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Show disk usage before install
      run: df -h

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies (Chromium + ChromeDriver + fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser chromium-chromedriver || true
        sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-wqy-zenhei fonts-wqy-microhei fonts-dejavu-core || true
        sudo apt-get clean || true
        sudo fc-cache -fv

    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt

    - name: Run offline regression checks
      run: |
        python -B -m unittest discover -s src -p test_monitoring_checks.py -v
        node --test site/dashboard.test.cjs

    - name: Cleanup pip cache and temp files
      run: |
        python -m pip cache purge || true
        df -h

    - name: Run Auto Monitor (Linux)
      shell: bash
      run: |
        echo "Running Python wrapper"
        python3 src/run_workflow_wrapper.py

    - name: Commit and push verified data
      id: publish
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        branch=${GITHUB_REF##*/}
        if git diff --quiet -- data/electricity_data.json; then
          echo "::error::Collection did not produce new electricity data"
          exit 1
        fi
        git add data/ logs/
        git commit -m "Auto update: verified electricity data (run ${GITHUB_RUN_ID})"
        # checkout 使用本次运行的 GITHUB_TOKEN，不再依赖长期 PAT。
        # 非快进推送必须失败，不能覆盖并发人工修改，也不能发布未推送的数据。
        git push origin "HEAD:$branch"
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "Verified electricity data committed and pushed successfully." >> "$GITHUB_STEP_SUMMARY"

    - name: Show latest wrapper log
      if: always()
      shell: bash
      run: |
        echo "Logs dir content:";
        ls -lt logs || true
        latest=$(ls -t logs 2>/dev/null | head -n1 || true)
        if [ -n "$latest" ]; then
          echo "---- BEGIN latest log: $latest ----";
          cat "logs/$latest" || true
          echo "---- END latest log ----";
        else
          echo "No log files found in ./logs"
        fi

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nju_electric_monitor-logs-${{ github.run_id }}
        path: |
          logs/**

  deploy-pages:
    needs: run-monitor
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.run-monitor.outputs.data_commit }}

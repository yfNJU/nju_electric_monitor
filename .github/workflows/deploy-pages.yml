name: Deploy electricity dashboard

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    - cron: '30 1,7,13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp site/index.html _site/index.html
          cp data/electricity_data.json _site/data/electricity_data.json
          cp data/electricity_data.csv _site/data/electricity_data.csv || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
